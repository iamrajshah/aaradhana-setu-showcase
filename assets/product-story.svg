<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">AaradhanaSetu product story</title><desc id="desc">A multilingual devotional library with offline reading, language choices, and a calm mobile interface.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3b0d48"/><stop offset=".55" stop-color="#7c2d12"/><stop offset="1" stop-color="#f59e0b"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf7"/><stop offset="1" stop-color="#fff7ed"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="24" stdDeviation="25" flood-color="#2e1065" flood-opacity=".35"/></filter><style>.f{font-family:Inter,Segoe UI,Noto Sans,Arial,sans-serif}.muted{fill:#78716c}.ink{fill:#292524}</style></defs>
  <rect width="1440" height="760" rx="30" fill="url(#bg)"/><circle cx="1230" cy="120" r="240" fill="#fde68a" opacity=".12"/><circle cx="170" cy="720" r="310" fill="#fbcfe8" opacity=".08"/>
  <g class="f"><text x="78" y="82" fill="#fed7aa" font-size="14" font-weight="750" letter-spacing="2.4">MULTILINGUAL · OFFLINE-FIRST · CALM BY DESIGN</text><text x="78" y="144" fill="#fff" font-size="48" font-weight="800">AaradhanaSetu</text><text x="78" y="188" fill="#ffedd5" font-size="22">Devotional reading that stays with you.</text>
    <g transform="translate(80 248)"><text fill="#fff" font-size="28" font-weight="750">One library. Four familiar languages.</text><text y="45" fill="#fed7aa" font-size="18">ગુજરાતી  ·  मराठी  ·  हिन्दी  ·  English</text><text y="108" fill="#fff" font-size="18">Discover by deity or reading type</text><text y="145" fill="#fff" font-size="18">Download once, read without a network</text><text y="182" fill="#fff" font-size="18">Save favourites and continue where you stopped</text><text y="219" fill="#fff" font-size="18">Receive catalogue updates without reinstalling</text></g>
    <g transform="translate(860 78)" filter="url(#s)"><rect width="410" height="610" rx="42" fill="#1c1917"/><rect x="13" y="13" width="384" height="584" rx="34" fill="url(#card)"/><rect x="154" y="22" width="104" height="22" rx="11" fill="#1c1917"/>
      <text x="42" y="92" class="ink" font-size="24" font-weight="800">નમસ્તે</text><text x="42" y="121" class="muted" font-size="14">Your devotional library</text><circle cx="338" cy="98" r="24" fill="#ffedd5"/><path d="M330 99c8-12 16 0 8 9-8-9-16-21-8-9z" fill="#ea580c"/>
      <rect x="34" y="151" width="316" height="114" rx="22" fill="#7c2d12"/><circle cx="302" cy="206" r="74" fill="#f59e0b" opacity=".28"/><text x="58" y="188" fill="#fed7aa" font-size="13" font-weight="700">TODAY'S DARSHAN</text><text x="58" y="222" fill="#fff" font-size="22" font-weight="750">A quiet moment,</text><text x="58" y="248" fill="#fff" font-size="22" font-weight="750">wherever you are.</text>
      <text x="34" y="310" class="ink" font-size="18" font-weight="750">Browse by deity</text><g transform="translate(34 332)"><circle cx="35" cy="35" r="35" fill="#fef3c7"/><text x="18" y="43" fill="#b45309" font-size="24">ॐ</text><circle cx="125" cy="35" r="35" fill="#fae8ff"/><text x="108" y="43" fill="#86198f" font-size="24">ॐ</text><circle cx="215" cy="35" r="35" fill="#ffedd5"/><text x="198" y="43" fill="#c2410c" font-size="24">ॐ</text><circle cx="305" cy="35" r="35" fill="#fee2e2"/><text x="288" y="43" fill="#b91c1c" font-size="24">ॐ</text></g>
      <text x="34" y="449" class="ink" font-size="18" font-weight="750">Continue reading</text><rect x="34" y="470" width="316" height="82" rx="18" fill="#fff" stroke="#fed7aa"/><rect x="50" y="486" width="49" height="50" rx="10" fill="#ffedd5"/><path d="M64 498h22v26H64z" fill="none" stroke="#ea580c" stroke-width="2"/><text x="118" y="503" class="ink" font-size="15" font-weight="700">Shiv Rudrashtakam</text><text x="118" y="526" class="muted" font-size="13">Available offline · page 3</text><rect x="118" y="538" width="190" height="5" rx="3" fill="#e7e5e4"/><rect x="118" y="538" width="112" height="5" rx="3" fill="#f97316"/>
      <text x="36" y="578" fill="#9a3412" font-size="12" font-weight="700">HOME</text><text x="127" y="578" class="muted" font-size="12">LIBRARY</text><text x="234" y="578" class="muted" font-size="12">FAVOURITES</text>
    </g>
  </g>
</svg>
