<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">AaradhanaSetu public architecture</title><desc id="desc">Mobile reader and private publisher portal connected to an authorization API, catalogue database, and private content storage.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7ed"/><stop offset="1" stop-color="#fdf4ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".11"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#78716c"/></marker><style>.f{font-family:Inter,Segoe UI,Arial,sans-serif}.h{fill:#292524;font-size:19px;font-weight:750}.p{fill:#78716c;font-size:14px}.a{stroke:#78716c;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="600" rx="28" fill="url(#bg)"/><text x="60" y="64" class="f h" font-size="29">AaradhanaSetu · public system view</text><text x="60" y="94" class="f p">A sanitized view of product boundaries. Live identifiers, private URLs, content files, and operating procedures are deliberately omitted.</text>
  <g filter="url(#s)" class="f">
    <rect x="60" y="154" width="260" height="300" rx="22" fill="#fff"/><rect x="60" y="154" width="260" height="62" rx="22" fill="#ea580c"/><path d="M60 192h260v24H60z" fill="#ea580c"/><text x="90" y="193" fill="#fff" font-size="20" font-weight="750">Mobile reader</text><text x="92" y="260" class="h">Ionic React + Capacitor</text><text x="92" y="299" class="p">Four-language catalogue</text><text x="92" y="330" class="p">Offline starter library</text><text x="92" y="361" class="p">Verified downloads</text><text x="92" y="392" class="p">PDF reader + local state</text>
    <rect x="390" y="154" width="250" height="300" rx="22" fill="#fff"/><rect x="390" y="154" width="250" height="62" rx="22" fill="#7c3aed"/><path d="M390 192h250v24H390z" fill="#7c3aed"/><text x="420" y="193" fill="#fff" font-size="20" font-weight="750">Private publisher</text><text x="420" y="260" class="h">React portal</text><text x="420" y="299" class="p">Localized metadata</text><text x="420" y="330" class="p">Versioned documents</text><text x="420" y="361" class="p">Images + ordering</text><text x="420" y="392" class="p">Preview then publish</text>
    <rect x="720" y="154" width="260" height="300" rx="22" fill="#fff"/><rect x="720" y="154" width="260" height="62" rx="22" fill="#334155"/><path d="M720 192h260v24H720z" fill="#334155"/><text x="750" y="193" fill="#fff" font-size="20" font-weight="750">Edge API</text><text x="752" y="260" class="h">Cloudflare Workers</text><text x="752" y="299" class="p">Catalogue contract</text><text x="752" y="330" class="p">Publisher authorization</text><text x="752" y="361" class="p">Checksums + version rules</text><text x="752" y="392" class="p">Short-lived delivery access</text>
    <rect x="1050" y="154" width="290" height="300" rx="22" fill="#fff"/><text x="1080" y="209" class="h">Managed data plane</text><rect x="1080" y="244" width="230" height="64" rx="14" fill="#eef2ff"/><text x="1105" y="273" class="h" font-size="16">D1 catalogue</text><text x="1105" y="294" class="p">metadata + publication state</text><rect x="1080" y="329" width="230" height="64" rx="14" fill="#fff7ed"/><text x="1105" y="358" class="h" font-size="16">Private R2 storage</text><text x="1105" y="379" class="p">PDF and image versions</text>
  </g>
  <path d="M320 275H710" class="a"/><path d="M640 335H710" class="a"/><path d="M980 275H1040" class="a"/><path d="M1040 365H990" class="a"/><text x="355" y="258" class="f p">catalogue + authorized downloads</text><text x="647" y="319" class="f p">publish</text><text x="412" y="514" class="f p">Reader remains useful offline after approved content is stored on-device.</text>
</svg>
